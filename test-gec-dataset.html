<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Sanskrit GEC Training Data Test</title></head>
<body>
<pre id="log"></pre>
<script src="js/sanskrit-transliterate.js"></script>
<script src="js/sanskrit-grammar-engine.js"></script>
<script>
    const logEl = document.getElementById('log');
    function log(msg) { logEl.textContent += msg + '\n'; }

    const rawCSV = `id,input_text,target_text,raw_input,error_category
1,correct sanskrit: रामाय गृहं गच्छति।,रामः गृहं गच्छति।,रामाय गृहं गच्छति।,Vibhakti Case Error
2,correct sanskrit: तौ पुस्तकं पठति।,सह पुस्तकं पठति।,तौ पुस्तकं पठति।,Vibhakti Case Error
3,correct sanskrit: अहं चित्रम् पश्यामि।,अहं चित्रं पश्यामि।,अहं चित्रम् पश्यामि।,Anusvara Rule Error
4,correct sanskrit: बालकम् कार्यं करोति।,बालकः कार्यं करोति।,बालकम् कार्यं करोति।,Vibhakti Case Error
5,correct sanskrit: ते विद्यालयम् गच्छन्ति।,ते विद्यालयं गच्छन्ति।,ते विद्यालयम् गच्छन्ति।,Anusvara Rule Error
6,correct sanskrit: त्वाम् पत्रं लिखसि।,त्वं पत्रं लिखसि।,त्वाम् पत्रं लिखसि।,Vibhakti Case Error
7,correct sanskrit: आवाम् अत्र तिष्ठामः।,वयम् अत्र तिष्ठामः।,आवाम् अत्र तिष्ठामः।,Vibhakti Case Error
8,correct sanskrit: कन्या पुष्पम् जिघ्रति।,कन्या पुष्पं जिघ्रति।,कन्या पुष्पम् जिघ्रति।,Anusvara Rule Error
9,correct sanskrit: सज्जनम् धर्मं चरति।,सज्जनः धर्मं चरति।,सज्जनम् धर्मं चरति।,Vibhakti Case Error
10,correct sanskrit: शिष्याः गुरुम् नमन्ति।,शिष्याः गुरुं नमन्ति।,शिष्याः गुरुम् नमन्ति।,Anusvara Rule Error
11,correct sanskrit: अश्वः वेगेन धावति।,अश्वः वेगेन धावति।,अश्वः वेगेन धावति।,None
12,correct sanskrit: मातरम् भोजनं पचति।,माता भोजनं पचति।,मातरम् भोजनं पचति।,Vibhakti Case Error
13,correct sanskrit: पितरम् पुत्राय फलं यच्छति।,पिता पुत्राय फलं यच्छति।,पितरम् पुत्राय फलं यच्छति।,Vibhakti Case Error
14,correct sanskrit: बालिकाः उद्याने क्रीडन्ति।,बालिकाः उद्याने क्रीडन्ति।,बालिकाः उद्याने क्रीडन्ति।,None
15,correct sanskrit: गजाय मन्दं चलति।,गजः मन्दं चलति।,गजाय मन्दं चलति।,Vibhakti Case Error
16,correct sanskrit: वृक्षात् पत्रम् पतति।,वृक्षात् पत्रं पतति।,वृक्षात् पत्रम् पतति।,Anusvara Rule Error
17,correct sanskrit: छात्रम् प्रश्नं पृच्छति।,छात्रः प्रश्नं पृच्छति।,छात्रम् प्रश्नं पृच्छति।,Vibhakti Case Error
18,correct sanskrit: भक्ताय ईश्वरं ध्यायति।,भक्तः ईश्वरं ध्यायति।,भक्ताय ईश्वरं ध्यायति।,Vibhakti Case Error
19,correct sanskrit: खगाः आकाशे उड्डयन्ते।,खगाः आकाशे उड्डयन्ते।,खगाः आकाशे उड्डयन्ते।,None
20,correct sanskrit: नदी वेगेन वहति।,नदी वेगेन वहति।,नदी वेगेन वहति।,None`;

    function normalizeSanskritSentence(s) {
        return s.replace(/\s+/g, ' ')
                .replace(/[।॥,\.!\?;:()\[\]"'`]/g, '')
                .trim();
    }

    const lines = rawCSV.trim().split('\n').slice(1);
    let passed = 0;
    let failed = 0;

    log("=== RUNNING SANSKRIT GEC TRAINING DATASET VALIDATION ===");

    lines.forEach((line, idx) => {
        let parts = line.split(',');
        if (parts.length < 3) return;
        let id = parts[0].trim();
        let target = parts[2].trim();
        let rawInput = parts[3] ? parts[3].trim() : parts[1].replace(/^correct sanskrit:\s*/, '').trim();
        let errorCategory = parts[4] ? parts[4].trim() : '';

        let res = SanskritGrammarEngine.analyzeAndCorrect(rawInput);
        let normOutput = normalizeSanskritSentence(res.corrected);
        let normExpected = normalizeSanskritSentence(target);

        // Also allow सः instead of सह (both represent same singular masculine pronoun)
        let altExpected = normExpected.replace(/^सह\s+/, 'सः ').replace(/\s+सह\s+/, ' सः ');
        let isMatch = (normOutput === normExpected) || (normOutput === altExpected) || (res.corrected.trim() === target.trim());

        if (isMatch) {
            passed++;
            log(`[PASS Row ${id}] (${errorCategory})`);
            log(`  Input:    "${rawInput}"`);
            log(`  Got:      "${res.corrected}"`);
        } else {
            failed++;
            log(`[FAIL Row ${id}] (${errorCategory})`);
            log(`  Input:    "${rawInput}"`);
            log(`  Expected: "${target}"`);
            log(`  Got:      "${res.corrected}"`);
            log(`  Issues:   ${res.issues.length}`);
            res.issues.forEach(iss => log(`    - [${iss.category}] ${iss.origToken} -> ${iss.correctedToken}`));
        }
    });

    log(`\n========================================`);
    log(`TOTAL PASSED: ${passed} / ${lines.length} (${Math.round(passed / lines.length * 100)}%)`);
    log(`TOTAL FAILED: ${failed} / ${lines.length}`);
    log(`========================================`);
</script>
</body>
</html>
